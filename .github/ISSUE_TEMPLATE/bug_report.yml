name: Bug report
description: Report a reproducible server, tool, or documentation problem
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please include enough detail to reproduce the issue. Remove account details, keys, private IPs, client files, and exported game data from logs or attachments.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Commit SHA, release, or the date you cloned the repository.
      placeholder: e.g. main at abc1234
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and .NET version
      placeholder: e.g. Windows 11 x64, dotnet --version 10.0.x
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup and commands
      description: What were you running, and which commands or settings matter?
      placeholder: Local server with exported data; command and relevant configuration.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start ...
        2. Send / open ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
      placeholder: Expected ...; instead ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or evidence
      description: Paste a short sanitized excerpt, error, stack trace, or client message ID. Say if no logs are available.
      render: text
    validations:
      required: false
  - type: textarea
    id: checks
    attributes:
      label: Checks already tried
      description: Build or test command and its result, if applicable.
    validations:
      required: false
