<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="RO3Emu - a Ragnarok Online 3 server emulator">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2740"/>
      <stop offset="1" stop-color="#0e1424"/>
    </linearGradient>
    <linearGradient id="crystalL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset="1" stop-color="#c98a2b"/>
    </linearGradient>
    <linearGradient id="crystalR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4c86a"/>
      <stop offset="1" stop-color="#8a5a17"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6c869" stop-opacity=".35"/>
      <stop offset="1" stop-color="#f6c869" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <rect width="1200" height="260" rx="14" fill="url(#sky)"/>
  <rect width="1200" height="260" rx="14" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="6" rx="3" fill="#d8b46a" opacity=".85"/>

  <!-- an Emperium-like crystal: the siege objective every RO player knows -->
  <g transform="translate(170 132)">
    <circle r="112" fill="url(#glow)"/>
    <polygon points="0,-92 -46,-14 0,94" fill="url(#crystalL)"/>
    <polygon points="0,-92 46,-14 0,94" fill="url(#crystalR)"/>
    <polygon points="0,-92 -46,-14 0,-4 46,-14" fill="#fff4cf" opacity=".55"/>
    <polygon points="-46,-14 0,-4 0,94" fill="#ffffff" opacity=".08"/>
    <polygon points="0,-92 -46,-14 0,94 46,-14" fill="none" stroke="#fff1c4" stroke-opacity=".7" stroke-width="2"/>
    <ellipse cx="0" cy="104" rx="58" ry="9" fill="#000" opacity=".35"/>
  </g>

  <text x="320" y="122" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="#f3f5fa" letter-spacing="1">RO3<tspan fill="#e1bb6c">Emu</tspan></text>
  <text x="324" y="166" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" fill="#b9c3d6">A server emulator for the Ragnarok Online 3 client</text>
  <text x="324" y="206" font-family="'Cascadia Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="16" fill="#a0adc1">C# · .NET 10 · one game loop · SQLite · client-documented protocol</text>
</svg>
